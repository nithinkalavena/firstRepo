<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button{
        cursor: pointer;
    }
</style>
<body>
    <center><button id="btn" onclick="change()" style="margin-top: 50px;">Programming</button></center>   
    <script>        
        function change(){
            let s='Programming'
            let result=''
            for(let i=0; i<s.length; i++){
                let found = false
                for(let j=0; j<i; j++){
                    if(s[i]==s[j]){
                        found=true
                        break
                    }
                }
                if(!found)
                    result+=s[i]
            }
            document.getElementById('btn').textContent=result
        }        
    </script>
</body>
</html>
