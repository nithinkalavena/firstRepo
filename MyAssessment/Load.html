<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #load{
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid #ddd;
        border-top: solid blue 2px;
        animation: spin 1.2s linear infinite;
    }
    @keyframes spin {
        to{
            transform: rotate(360deg);
        }
    }
</style>
<body>
    <div id="load"></div>
</body>
</html>
