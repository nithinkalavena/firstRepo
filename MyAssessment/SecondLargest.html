    <script>
        function find(){
        let a = [10,20,5,8,30]
        let largest = a[0]
        let count=0

            if(largest<a[i]){  
                count++
                largest=a[i]
            }
            if(count==1)
            console.log('second largest number is', largest)
        }
        }
    </script>
