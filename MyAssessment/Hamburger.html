<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #container{
        width: 45px;
        cursor: pointer;
    }
    *{
        font-family: cursive;
        font-size: 20px;
        text-align: center;
    }
    #lines span{
        width: 35px;
        height: 3px;
        background-color:red;
        margin: 6px 0;
        display: block;
        transition:all 0.4s ease;
        border-radius: 2px;
    }
    li{
        list-style-type: none;
        padding: 8px;
        color: white;
    }
    nav{
        max-height: 0;
        transition: max-height 0.4s ease;
        background: gray;
        position: absolute;
        top: 50px;
        left: 10px;    
        border-radius: 8px;
    }
    #MenuList.active{
        max-height: 200px;
    }
    #lines.active span:nth-child(1){
        transform: rotate(45deg) translate(5px,5px);
    }
    #lines.active span:nth-child(2){
        opacity: 0;
    }
    #lines.active span:nth-child(3){
        transform: rotate(-45deg) translate(6px,-6px);
    }
</style>
<body>
    <div id="container">
        <div id="lines" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id='MenuList'>
            <li>Home</li>
            <li>Services</li>
            <li>About</li>
            <li>Contact</li>
        </nav>
    </div>
    <script>
        function toggleMenu(){
            document.getElementById('MenuList').classList.toggle('active')
            document.getElementById('lines').classList.toggle('active')
        }
    </script>
</body>
</html>
