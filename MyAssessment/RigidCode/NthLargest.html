<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <center><button onclick="largest()" style="margin-top: 50px;">Second Largest</button></center>
    <script>
        function largest(){
            let a = [10,20,5,8,30]
            let n = 1
            for(let i=0; i<a.length; i++){
            let count=0
            for(let j=0; j<a.length; j++){
                if(a[j]>a[i]){
                    count++
                }
            }
            if(count==n){
                console.log('second-largest',a[i])
            }
        }
        }
    </script>
</body>
