<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- A function stored inside a variable -->
     <!-- function expression:- a function stored in a variable -->
     <script>
        let greet = function(){
            console.log("hello")
        }
        greet()
        //Not hosted like function declarations
        //useful when passing functions as values
     </script>
</body>
</html>
