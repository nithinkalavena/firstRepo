<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="UserNameChecker.css">
</head>
<body>
    <div class="container">
        <h3>Check Username</h3>
        <input type="text" id="username" placeholder="enter username...">
        <div class="message" id="message"></div>
    </div>
    <script>
        let input = document.getElementById('username')
        let message = document.getElementById('message')

        let timer
        input.addEventListener('input',e=>{
            let value = e.target.value.trim()

            clearTimeout(timer)
            if(value === ''){
                message.textContent = ''
                return
            }
            message.textContent = '\u23F3 Checking...'
            message.className = 'message loading'

            timer = setTimeout(() => {
                fetch(`https://jsonplaceholder.typicode.com/users?username_like=${value}`)
                .then(d=>d.json())
                .then(data=>{
                    if(data.length > 0){
                        message.textContent = '\u274C Username already taken'
                        message.className = 'message taken'
                    }
                    else{
                        message.textContent = '\u2705 Username available'
                        message.className = 'message available'
                    }
                })
                .catch(err=>{
                    message.textContent = 'Error checking username'
                    message.className = 'message error'
                    console.log(err)
                })
            }, 500);
        })
    </script>
</body>
</html>
