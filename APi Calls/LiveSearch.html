<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="LiveSearch.css">
</head>
<body>
    <div class="container">
        <input type="text" placeholder="Search here..." id="search">
        <div class="results" id="results"></div>
    </div>
    <script>
        let input = document.getElementById('search')
        let resultBox = document.getElementById('results')
        let timer
        input.addEventListener('input',e=>{
            let value = e.target.value
            clearTimeout(timer)

            if(value === ''){
            resultBox.innerHTML=''
            return
            }

            timer = setTimeout(() => {
                fetch(`https://jsonplaceholder.typicode.com/users?name_like=${value}`)
                .then(d=>d.json())
                .then(d=>displayResults(d))
                .catch(err=>console.log(err))
            }, 500);            
        })

        function displayResults(data){
            resultBox.innerHTML=''
            if(data.length === 0){
                resultBox.innerHTML=`<div class='no-data'>No results found</div>`
                return
            }
            data.forEach(user => {
                let div = document.createElement('div')
                div.classList.add('item')
                div.textContent = user.name

                div.addEventListener('click',()=>{
                    input.value = user.name
                    resultBox.innerHTML=''
                })
                resultBox.appendChild(div)
            });
        }
    </script>
</body>
</html>
