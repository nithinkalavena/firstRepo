<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [1,2,1,3,2,1]
        for(let i=0; i<arr.length; i++){
            let count = 0
            for(let j=i+1; j<arr.length; j++){
                if(arr[i]===arr[j])
                    count++
            }
            let visited = false
            for(let k=0; k<i; k++){
                if(arr[i]==arr[k]){
                    visited = true
                    break
                }                                    
            }
            if(!visited){
                console.log(arr[i],'repeated =>',count+1,'times')
            }
        }
    </script>
</body>
</html>
