<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr =[10,25,40,15,35]
        for(let i=0; i<arr.length; i++){
            for(let j=i+1; j<arr.length; j++){
                if(arr[i]<arr[j]){
                    let temp = arr[i]
                    arr[i] = arr[j]
                    arr[j] = temp
                }
            }
        }
        let count = 0
        for(let i=0; i<arr.length; i++){
            count++
            if(count == 2){
                console.log('Second largest number',arr[i])
                break
            }
        }
    </script>
</body>
</html>
