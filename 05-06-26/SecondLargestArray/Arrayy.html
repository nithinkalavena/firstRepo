<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [10,25,40,15,35,39]
        let largest = arr[0]
        let second = arr[0]
        for(let i=1; i<arr.length; i++){
            if(arr[i]>largest){
                second = largest
                largest = arr[i]
            }
            else if(arr[i] > second && arr[i] !== largest){
                second = arr[i]
            }
        }
        console.log('Second largest number in the given array is',second)
    </script>
</body>
</html>
