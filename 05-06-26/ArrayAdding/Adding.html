<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //push is used to add the element to the array
        let fruits = ['apple','banana']
        fruits.push('Kiwi')
        console.log('Push method:',fruits)

        //unshift is used to add the element at the starting point
        let tasks = ['coding','testing']
        tasks.unshift('meeting')
        console.log('Unshift method:',tasks)
        
        //includes is used to check weather the element is present or not
        let students = ['ram','sam','john']
        let result = students.includes('sam')
        console.log('Includes method:',result)

        //indexof is used to fetch the index number of the selected element
        let products = ['laptop','mouse','keyboard']
        let index = products.indexOf('keyboard')
        console.log('indexOf method:',index)
    </script>
</body>
</html>
