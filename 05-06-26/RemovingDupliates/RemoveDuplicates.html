<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [1,2,3,2,4,1]
        let result = []
        for(let i=0; i<arr.length; i++){
            let found = false
            for(let j=0; j<result.length; j++){
                if(arr[i]===result[j]){
                    found = true
                    break
                }
            }
            if(!found)
                result[result.length] = arr[i]
        }
        console.log('After removing duplicates elements in an array',result)
    </script>
</body>
</html>
