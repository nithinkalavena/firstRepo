 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>

        //Promise represents an asynchronous operation
        //a promise is an object that represents a task that will complete in the future
        //Ex:-APi calls, file loading, database queries, timers
        //Promise has three states 
        //1)pending 2)fulfilled 3)rejected
        //promises are handled using .then,.catch
        //--> A promise is an object that handles asynchronous operations and their success or failure results.

        let pa = new Promise(resolve=>{
            setTimeout(() => {
                resolve('Pa is done')
            }, 1000);
        })
        let pb = new Promise(resolve=>{
            setTimeout(() => {
                resolve('pb is done')
            }, 1000);
        })
        let pc = new Promise((resolve,reject)=>{
            setTimeout(() => {
                reject('pc is rejected')
            }, 1500);
        })

        Promise.race([pa,pb,pc])
        .then(a=>console.log(a))
        .catch(a=>console.log(a))

        Promise.all([pa,pb,pc])
        .then(a=>console.log(a))
        .catch(a=>console.log(a))

        Promise.allSettled([pa,pb,pc])
        .then(a=>console.log(a))
        .catch(a=>console.log(a))

        Promise.any([pa,pb,pc])
        .then(a=>console.log(a))
        .catch(a=>console.log(a))

        //Promise using with async and await function
        function run(ms){
            return new Promise((resolve,reject)=>{
                setTimeout(() => {
                    reject('rejected')
                }, ms);
            })
        }
        async function run2(ms) {
            let result = await run(ms)  
            .catch(a=>console.log(a))          
        }
        run2(99)
    </script>
 </body>
 </html>
