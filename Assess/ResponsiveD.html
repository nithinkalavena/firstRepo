<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gallery{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 15px;
            padding: 20px;
        }
        img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        @media (max-width: 992px) and (orientation: landscape){
            .gallery{
                grid-template-columns: repeat(2,1fr);
            }
        }
        @media (max-width: 576px) and (orientation: portrait){
            .gallery{
                grid-template-columns: repeat(1,1fr);
            }
        }
    </style>
</head>
<body>
    <h2>Responsive Image Gallery</h2>
    <div class="gallery">
    <img src="https://picsum.photos/400?1" alt="no image found">
    <img src="https://picsum.photos/400?2" alt="no image found">
    <img src="https://picsum.photos/400?3" alt="no image found">
    <img src="https://picsum.photos/400?4" alt="no image found">
    <img src="https://picsum.photos/400?5" alt="no image found">
    <img src="https://picsum.photos/400?6" alt="no image found">
    <img src="https://picsum.photos/400?7" alt="no image found">
    <img src="https://picsum.photos/400?8" alt="no image found">
    <img src="https://picsum.photos/400?9" alt="no image found">
    <img src="https://picsum.photos/400?10" alt="no image found">
    <img src="https://picsum.photos/400?11" alt="no image found">    
    </div>
</body>
</html>
