<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fetchData()">Fetch</button>
    <h3>Qoute of the day : </h3><p id="quote"></p>
    <script>
        let quote = document.getElementById('quote')
        function fetchData(){
            fetch('https://dummyjson.com/quotes/random')
            .then(d=>d.json())
            .then(d=>quote.textContent=d.quote)
            .catch(err=>quote.textContent='error fetching quote')
        }
        fetchData() 
    </script>
</body>
</html>
