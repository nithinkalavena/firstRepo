<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- template literals are strings enclosed in backticks(``) -->
    <script>
        let name = 'Nithin'
        console.log(`Hello ${name}`)

        let course = 'Java Full Stack'
        console.log(`My name is ${name} and i am learning ${course}`)

        let a=10
        let b=20
        console.log(`sum: ${a+b}`)

        //without literals
        let msg = 'hello\nwelcome\njavascript'
        console.log(msg)

        //with literals
        let msg2 = `Hello
        Welcome
        Javascript`
        console.log(msg2)
    </script>
</body>
</html>
