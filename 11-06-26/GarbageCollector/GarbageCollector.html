<body>
    <!-- Garbage collection is the automatic process in javascript that removes unused memory to freeup space. -->
    <script>
        function createUser(){
            let user = {
                name:'Nithin'
            }
        }
        createUser()
        // After the function finishes, user is no longer accessible
        // garbage collector will eventually remove it from memory
    </script>
