<body>
    <!-- generating random number between 1 to 100 -->
    <script>
        let num = Math.floor(Math.random()*100)+1
        console.log(num)
        //between 50 to 100
        let num2 = Math.floor(Math.random()*(100-50+1))+50
        console.log(num2)
    </script>
