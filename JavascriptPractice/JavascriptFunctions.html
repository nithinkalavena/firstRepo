<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = [1,2,3]
        console.log(...a)
        function greet(){
            console.log('hello')
        }
        greet()
        //Named function
        let sum = function add(a,b){
            return a+b
        }
        console.log(sum(1,4))
        //Anonymous function
        let sum2 = function (a,b){
            return a-b
        }
        console.log(sum2(90,89))
        //Arrow function
        let sum3 = (a,b)=>console.log(a*b)
        sum3(8,9)

        function sum4(...nums){
            return nums.reduce((a,b)=>a+b)
        }
        console.log(sum4(1,2,3))

        for(let i=0; i<5; i++){
            if(i===2) continue
            if(i===4) break
            console.log(i)
        }

        //for in returns the keys/indexes
        //best for objects
        //works on both objects and arrays
        let ob = {a:1,b:2}
        let ob1 = [1,2,3]
        for(let key in ob1)
        console.log(key,ob1[key])

        // for of returns the values
        //works on iterable only
        for(let key of ob1)
        console.log(key) 

        //Access the variable before its initialization
        // console.log(hoisting)
        let hoisting = 10

        let user = {
            name:'nithin',
            greet: function (){
                console.log(this.name)
            }
        }
        user.greet()

        //Closure
        //a closure is when a function remembers variables from its outer scope even afer that outer function has finishedd execution
        function outer(){
            let count = 0
            function inner(){
                count++
                console.log(count)
            }
            return inner
        }
        let counter = outer()
        counter()   //1
        counter()   //2
        counter()   //3
    
        function show(){
            console.log(this)
        }
        show()
    </script>
</body>
</html>
