<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Event Handling - Bubbling & Capturing</h2>
    <div id="parent">
        parent
        <button id="child">Click me</button>
    </div>
    <h2>Event Delegation</h2>
    <ul id="list">
        <li>Item1</li>
        <li>item2</li>
        <li>item3</li>
    </ul>
    <!-- //Event Bubling means the event moves from child to parent
    //Event capturing means the event moves from parent to child
    //Event Deligation means using a parent element to handle events of its child elements -->
    <script>
        let parent = document.getElementById('parent')
        let child = document.getElementById('child')
        //Event bubbling
        parent.addEventListener('click',()=>{
            console.log('parent clicked (Bubbling)')
        })
        
        child.addEventListener('click',()=>{
            console.log('child clicked (Bubbling)')
        })
        //event capturing
        parent.addEventListener('click',()=>{
            console.log('parent clicked (Capturing)')
        },true)
        child.addEventListener('click',()=>{
            console.log(('child clicked (capturing)'))
        },true)
        //event Delegation
        document.getElementById('list').addEventListener('click',(e)=>{
            if(e.target.tagName == 'LI')
                console.log('clicked',e.target.textContent)
        })
        let list = document.getElementById('list')
        let li = document.createElement('li')
        li.textContent = 'new item'
        list.appendChild(li)
    </script>
</body>
</html>
