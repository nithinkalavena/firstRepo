<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Object with constructor</h3>
    <script>
        const person = new Object();

        person.name = "John";
        person.age = 25;
        person.city = "New York";

        console.log(person);
        delete person.city
        console.log(person)
        person.age = 19
        person.name = 'Raj'
        console.log(person)
        person.city = 'hyd'
        console.log(person)

    </script>
</body>
