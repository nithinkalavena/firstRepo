<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Objects with methods on console
    <script>
        let person = {
            name:'myName',
            greet:function(){
                console.log('function inside object')
            }
        }
        console.log(person)
        person.greet()

        const person2 = {
        name: "currentObject",
        greet() {
            console.log("Hello, I'm " + this.name);
        }
        };

        person2.greet();
    </script>
</body>
</html>
