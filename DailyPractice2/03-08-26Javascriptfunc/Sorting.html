<body>
    sorting of array
    <script>
        let arr = [3, 7, 44, 8, 4, 6, 3, 1]
        function sort(){
            for(let i=0; i<arr.length; i++){
                
                for(let j=i+1; j<arr.length; j++){
                    if(arr[i]>arr[j]){
                        let temp = arr[i]
                        arr[i] = arr[j]
                        arr[j] = temp
                    }
                }
            }
            return arr
        }
        console.log(sort())
        
    </script>
</body>
