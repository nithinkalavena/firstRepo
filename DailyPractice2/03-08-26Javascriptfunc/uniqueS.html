<body>
    unique characters in string
    <script>
        function uni(){
            let str = 'javascript'
            for(let i=0; i<str.length; i++){
                let present = false
                for(let j=i+1; j<str.length; j++){
                    if(str[i]===str[j]){
                        present = true
                        break
                    }
                }
                if(!present){
                    console.log(str[i])
                }
            }
        }
        uni()
    </script>
</body>
