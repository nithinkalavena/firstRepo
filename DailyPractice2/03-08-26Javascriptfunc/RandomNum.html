<body>
    Random number between 1 to 100
    <script>
        function randomNumber() {
            let num = Math.floor(Math.random() * 100);
            console.log(num);
        }

        randomNumber();

        function ranNum(min,max){
            return Math.floor(Math.random()*(max-min+1))+min
        }
        console.log(ranNum(10,18))
    </script>
