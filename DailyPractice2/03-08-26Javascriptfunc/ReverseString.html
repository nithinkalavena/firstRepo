<body>
    Reversing the string on console
    <script>
        function Reverse(str){
            let result = ''
            for(let i=str.length - 1; i>=0; i--){
                result+=str[i]
            }
            return result
        }
        console.log(Reverse('hello'))
        console.log(Reverse('Nithin'))
    </script>
</body>
