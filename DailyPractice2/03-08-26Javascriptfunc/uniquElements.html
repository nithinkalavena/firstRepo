<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique</title>
</head>
<body>
    picking unique elements in array
    <script>
        let arr = [1,2,2,4,5,3,7,5]
        for(let i=0; i<arr.length; i++){
            let count = 0
            for(let j=0; j<arr.length; j++){
                if(arr[i]===arr[j])
                    count++
            }
            if(count===1)
                console.log(arr[i])
        }
    </script>
</body>
</html>
