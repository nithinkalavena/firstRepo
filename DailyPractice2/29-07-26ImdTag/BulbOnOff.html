<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            text-align: center;
        }
        button{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.w3schools.com/js/pic_bulboff.gif" alt="" id="bulb"><br>
        <button onclick="onBulb()">ON</button>
        <button onclick="offBulb()">OFF</button>
    </div>
    <script>
        function onBulb(){
            document.getElementById('bulb').src = 'https://www.w3schools.com/js/pic_bulbon.gif'
        }
        function offBulb(){
            document.getElementById('bulb').src = 'https://www.w3schools.com/js/pic_bulboff.gif'
        }
    </script>
</body>
</html>
