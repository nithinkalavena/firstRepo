<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            text-align: center;            
        }
        button{
            margin: 10px;
            cursor: pointer;
        }
    </style>    
</head>
<body>
    <div class="container">
        <img src="https://picsum.photos/id/1015/400/250" alt="no image found" id="slider"><br>
        <button id="prev">Previous</button>
        <button id="nxt">Next</button>
    </div>
    <script>
        images = [
                'https://picsum.photos/id/1015/400/250',
                'https://picsum.photos/id/1025/400/250',
                'https://picsum.photos/id/1035/400/250'
            ]
        let slider = document.getElementById('slider')
        let currentIndex = 0
        document.getElementById('nxt').addEventListener('click',function(){
            currentIndex++
            if(currentIndex >= images.length)
                currentIndex = 0
            slider.src = images[currentIndex]
        })
        document.getElementById('prev').addEventListener('click',function(){
            currentIndex--
            if(currentIndex < images.length)
                currentIndex = images.length - 1
            slider.src = images[currentIndex]
        })
    </script>
</body>
</html>
