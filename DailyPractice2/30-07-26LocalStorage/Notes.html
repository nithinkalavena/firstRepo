<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
</head>
<body>
    <h2>Notes</h2>
    <textarea name="" id="notes" rows="8" cols="40"></textarea>
    <script>
        let notes = document.getElementById('notes')
        notes.value = sessionStorage.getItem('notes')|| ""
        notes.addEventListener('input',function(){
            sessionStorage.setItem('notes',notes.value)
        })
    </script>
</body>
</html>
