<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .drop-area{
            width: 300px;
            height: 200px;
            border: 2px dashed gray;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .drop-area:hover{
            border-color: blue;
            background: #f0f8ff;
        }
        input[type='file']{
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <label for="" class="drop-area">Drag & Drop image here 
        <br><br>
        <span>or Click to upload</span>
    </label>
    <input type="file" name="" id="" accept="image/*">
</body>
</html>
