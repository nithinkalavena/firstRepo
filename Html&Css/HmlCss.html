<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="seo.png" type="image/x-icon">
</head>
<body>
    <!-- Padding: Inner space around the content
    Border: Outline around the content
    Margin: Outerspace outside the content
    this is css box model -->
    
    <!-- box-sizing:
    border-box: width= everything inside border
    content-box: width= content only -->
    
    <!-- inline and block element -->
    <h3>This is block element</h3>
    <strong>This is inline element</strong>
    <input type="text" placeholder="inline/block element">
    <!-- html attributes -->
    <a href="https://example.com">Visit</a> <br><br>
    <!-- iframe is mainly used for playing youtube videos, maps and internal pages -->
    <iframe width="200px" height="150px" style="border:0;"
    src="https://www.google.com/maps/embed/v1/place?q=Hyderabad&key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8"></iframe>

</body>
</html>
