<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>image slider</h2>
    <img src="https://picsum.photos/id/1015/400/250" id="slider" alt="" width="400">
    <br><br>
    <button id="prev">Prev</button>
    <button id="nxt">Nxt</button>
    <script>
        const images = [
            "https://picsum.photos/id/1015/400/250",
            "https://picsum.photos/id/1025/400/250",
            "https://picsum.photos/id/1035/400/250"
        ]

        const slider = document.getElementById('slider')
        let currentIndex = 0

        document.getElementById('nxt').addEventListener('click',function(){
            currentIndex++
            if(currentIndex>=images.length)
                currentIndex=0
            slider.src = images[currentIndex]
        })

        document.getElementById('prev').addEventListener('click',function(){
            currentIndex--
            if(currentIndex<0)
                currentIndex=images.length-1

            slider.src = images[currentIndex]
        })
    </script>
</body>
</html>
