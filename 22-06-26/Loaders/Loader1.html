<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    #loader{
        width: 20px;
        height: 20px;
        border: 2px solid #ccc;
        border-top: 2px solid blue;
        border-radius: 50%;        
        animation: spin linear infinite 0.8s;
    }
    @keyframes spin {
        to{
            transform: rotate(360deg);
        }
    }

</style>
<body>
    <div id="loader">

    </div>
</body>
