<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #loader{
        width: 50px;
        height: 50px;
        background-color: blue;
        border-radius: 50%;
        animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
        0%{
            transform: scale(1);
            opacity: 1;
        }
        50%{
            transform: scale(1.5);
            opacity: 0.5;
        }
        100%{
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
<body>
    <div id="loader"></div>
</body>
</html>
