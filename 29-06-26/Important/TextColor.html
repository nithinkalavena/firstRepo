<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .c{
            color: red !important;
        }
        .c{
            color: blue;
        }        
    </style>
</head>
<body>
    <!-- the text color is red because !important overrides the blue -->
    <p class="c">change the color of this text</p>
</body>
</html>
