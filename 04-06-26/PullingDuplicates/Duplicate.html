<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="showDuplicates()">Click Here</button><br><br>
    <span id="output"></span>
    <script>
        function findDuplicates(str){
            str = str.toLowerCase()
            let duplicates = []
            for(let i=0; i<str.length; i++){
                let count = 0
                for(let j=0; j<str.length; j++){
                    if(str[i]===str[j])
                        count++
                }
                if(count>1 && !duplicates.includes(str[i]))
                    duplicates.push(str[i])
            }
            return duplicates
        }
        function showDuplicates(){
            let result = findDuplicates('committee')
            document.getElementById('output').innerHTML = result.join(',')
        }
    </script>
</body>
</html>
