<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Duplicates are repeated values in an array
    the most common way to remove Duplicates is using a Set -->
    <script>
        let nums = [1,2,2,3,4,4,5]
        let unique = [...new Set(nums)]
        console.log(unique)
    </script>
</body>
