<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="text" placeholder="Enter a string">
    <button onclick="countVC()">Count</button>
    <p id="out"></p>
    <script>
        function countVC(){
            let str = document.getElementById('text').value.toLowerCase()
            let vowels = 0
            let conso = 0
            for(let i=0; i<str.length; i++){
                if(str[i]==='a'||str[i]==='e'||str[i]==='i'||str[i]==='o'||str[i]==='u'){
                    vowels++
                }
                else
                    conso++
            }
            document.getElementById('out').innerHTML = 'Vowels : '+vowels+' <br>' +'Consonents : '+conso
        }
    </script>
</body>
</html>
