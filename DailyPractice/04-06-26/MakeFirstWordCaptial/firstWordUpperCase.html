<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="text" placeholder="Enter a sentence">
    <button onclick="Convert()">Convert</button>
    <p id="out"></p>
    <script>
        function Convert(){
            let str = document.getElementById('text').value
            let result = ''
            for(let i=0; i<str.length; i++){
                if(i === 0 || str[i-1] === ' '){
                    result += str[i].toUpperCase()
                }
                else{
                    result+=str[i]
                }
            }
            document.getElementById('out').innerHTML = '<h2>'+result+'</h2>'
        }
    </script>
</body>
</html>
