<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str = 'SoftwareEngineering'
        str = str.toLowerCase()
        let result = []
        for(let i=0; i<str.length; i++){
            let found = false
            for(let j=0; j<i; j++){
                if(str[i]===str[j]){
                    found = true
                    break
                }
            }
            if(!found)
                result.push(str[i])
        }
        console.log(result)
    </script>
</body>
</html>
