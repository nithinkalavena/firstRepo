<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function* count(){
            let i = 1
            while(i<=5){
                yield i++
            }
        }        
        for(let num of count()){
            console.log(num)
        }
    </script>
</body>
</html>
