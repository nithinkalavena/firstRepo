<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Pure func -->
    <script>
        // Gives the same output for the same input
        // does not modify external data
        function add(a,b){
            return a+b
        }
        console.log(add(2,3))
        // Impure func
        // depends on external vairable
        // modifies external data
        let count = 0
        function incre(){
            count++
            return count
        }
        console.log(incre())//because it changes the external variable count
    </script>    
</body>
</html>
