<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!-- a function that accepts another function as an argument or returns a function -->
    <script>
        function greet(name){
            return 'Hello '+name
        }
        function processUser(callback){
            console.log(callback('Nithin'))
        }
        processUser(greet)
    </script>
</body>
