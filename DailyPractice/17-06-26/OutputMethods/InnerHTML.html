<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- output methods are used to display data to the user or developer -->
    <!-- 1) InnerHTML
    sets or gets html content inside an element
    html tags are interpreted -->
    <p id="demo"></p>
    <script>
        document.getElementById('demo').innerHTML = '<b>Hello This is InnerHTML</b>'+'<h1>Hello good day</h1>'        
    </script>
</body>
</html>
