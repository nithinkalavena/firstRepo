<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Destructuring is a javascript feature that allows you to extract vlaues from object or arrays
    and assign them to variables in a concise way -->
    <!-- Object destructuring -->
    <!-- extracts properties from an object and stores them in variables -->
    <script>
        let student = {
            name:'Nithin',
            age:23,
            course:'Javascript'
        }
        console.log(student)
        let {name,age} = student
        console.log(age)

        let student2 = {
            name:'NithinK',age:22
        }
        let {name:studentName, age:studentAge} = student2
        console.log(studentName)

        // Default values
        let student3 = {
            name3:'NithinKalavena'
        }
        let {name3,age3=20} = student3
        console.log(name3)
        console.log(age3)
    </script>
</body>
</html>
