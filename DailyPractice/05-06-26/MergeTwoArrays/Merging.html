<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr1 = [1,2,3]
        let arr2 = [3,4,5]
        let result = []
        for(let i=0; i<arr1.length; i++){
            result[result.length] = arr1[i]
        }
        for(let i=0; i<arr2.length; i++){
            let found = false
            for(let j=0; j<result.length; j++){
                if(arr2[i]===result[j]){
                    found = true
                    break
                }
            }
            if(!found)
                result[result.length] = arr2[i]
        }
        console.log('Merging of Array with only unique values:',result)
    </script>
</body>
</html>
