<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- A shorter way to write functions -->
    <script>
        let greet = ()=>{
            console.log('this is arrow function')
        }
        greet()
        let add = (a,b)=> a+b
        console.log(add(10,20))
        console.log(add(1,2))
    </script>
</body>
</html>
