<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- this refers to the object that is currently executing the function -->
    <script>
        console.log(this)
        //Inside an object
        let person = {
            name:'Nithin',
            showName(){
                console.log(this.name)
            }
        }
        person.showName()

        //inside a regular function
        function test(){
            console.log(this)
        }
        test()
    </script>
</body>
</html>
