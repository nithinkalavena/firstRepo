<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        #container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #333;
            color: white;
        } 
        #nav{
            display: flex;
            gap: 20px;
        }
        #nav a{
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .nav a:hover{
            color: #ff9800;
        }
        #login{
            background-color: #ff9800;
            border: none;
            padding: 8px 15px;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        #login:hover{
            background-color: #e68900;
        }
        #hamburger{
            display: none;
            flex-direction: column;
            cursor: pointer;
        }
        #hamburger span{
            height: 3px;
            width: 25px;
            background: white;
            margin: 4px 0;
            display: block;
            transition: 0.3s;
        }
        #hamburger.active span:nth-child(1){
            transform: rotate(45deg) translate(5px, 5px);
        }
        #hamburger.active span:nth-child(2){
            opacity: 0;
        }
        #hamburger.active span:nth-child(3){
            transform: rotate(-45deg) translate(5px, -5px);
        }
        @media (max-width:768px) and (orientation: portrait){
            #nav{
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background-color: #333;
                flex-direction: column;
                text-align: center;            
                display: none;
            }
            #nav.active{
                display: flex;
            }
            #hamburger{
                display: block;
            }
            #login{
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div>Logo</div>
        <div id="nav">
            <div class="nav"><a href="#">Home</a></div>            
            <div class="nav"><a href="#">Services</a></div>
            <div class="nav"><a href="#">About</a></div>
            <div class="nav"><a href="#">Contact</a></div>
        </div>
        <button id="login">Login</button>
        <div id="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <script>
        function toggleMenu(){
            document.getElementById('nav').classList.toggle('active')
            document.getElementById('hamburger').classList.toggle('active')
        }
    </script>
</body>
</html>
