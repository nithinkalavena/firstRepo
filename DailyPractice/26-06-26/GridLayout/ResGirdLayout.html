<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 80px 250px 60px;            
            gap: 20px;   
            min-height: 100vh;         
        }
        header{
            grid-column: 1/-1;
            background: orange;
        }
        aside{
            background: grey;        
        }
        section{
            background: green;            
        }
        footer{
            background: black;
            color: white;
            grid-column: 1/-1;
        }
        .g{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (max-width:768px) {
            .container{
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="g">Header</header>
        <aside class="g">Sidebar</aside>
        <section class="g">Main Content</section>
        <footer class="g">Footer</footer>
    </div>
</body>
</html>
