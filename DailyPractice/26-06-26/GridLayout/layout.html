<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 300px 80px;
            gap: 10px;
        }
        header{
            grid-column: 1/3;
            background: tomato;
        }
        aside{
            background: lightgreen;
        }
        main{
            background: skyblue;    
        }
        footer{
            grid-column: 1/-1;
            background: gray;
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="box">Header</header>
        <aside class="box">Sidebar</aside>
        <main class="box">Content</main>
        <footer class="box">Footer</footer>
    </div>
</body>
</html>
