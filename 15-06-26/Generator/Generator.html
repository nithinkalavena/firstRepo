<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- A Generator is a special function that can pause and resume execution -->
    <!-- it is defined by using function*, uses yield keyword -->
    <script>
        function* numbers(){
            yield 1
            yield 2
            yield 3
        }
        let gen = numbers()
        console.log(gen.next())
        console.log(gen.next())
        console.log(gen.next())
        console.log(gen.next())
    </script>
</body>
</html>
