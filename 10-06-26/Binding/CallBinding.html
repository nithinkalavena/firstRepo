<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- invokes the function immediately and allows you to pass arguments one by one -->
    <script>
        function greet(city,country){
            console.log(`Hello, i'm ${this.name} from ${city}, ${country}`)
        }
        let person = {
            name:'Nithin'
        }
        greet.call(person,'Hyderabad','India')
    </script>
</body>
</html>
