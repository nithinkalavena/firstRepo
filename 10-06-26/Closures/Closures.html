<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- A closure is created when a inner function remembers variables from its outer function 
    even after the outer function has finished. -->
    <script>
        function outer(){
            let count = 0
            return function inner(){
                count++
                console.log(count)
            }
        }
        let counter = outer()
        counter()
        counter()
        counter()
    </script>
</body>
</html>
