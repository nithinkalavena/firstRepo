<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Badge</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .profile{
            position: relative;
            height: 120px;
            width: 120px;
        }
        .profile img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .badge{
            position: absolute;
            top: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: red;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="profile">
        <img src="https://picsum.photos/200" alt="Profile">
        <div class="badge">5</div>
    </div>
</body>
</html>
