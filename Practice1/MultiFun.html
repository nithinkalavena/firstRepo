<head>

    <title>Smple Multi Step Form</title>
</head>
<body>
    <h3>Step -1 Personal</h3>
    <div id="step1">
        <input id="text" name="" id="name"><br> <br>
        <input id="email"><br> <br>
        <button onclick="next(2)">Next</button>
    </div>

        <h3>Step 2 Address</h3>
        <div id="step2" style="display: none;">
            <input type="text" id="city"><br><br>
            <input type="text" id="country"><br><br>
            <button onclick="next(1)">Back</button>
            <button onclick="next(3)">Next</button>
        </div>

        <h3>Step 3 Review</h3>
        <div id="step3" style="display: none;">
            <p id="review"></p>
            <button onclick="next(2)">Back</button>
            <button onclick="submitForm()">Submit</button>
        </div>
    
    <script src="MultiFun.js"></script>
