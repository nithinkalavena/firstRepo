<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .loader{
            width: 20px;
            height: 20px;
            border: 2px solid #ddd; 
            border-radius: 50%;     
            border-top: 2px solid blue;       
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .loader2{
            display: flex;
            gap: 10px;
            margin-top: 50px;
        }
        .loader2 div{
            width: 15px;
            height: 15px;
            background: blue;
            border-radius: 50%;
            animation: bounce 0.6s alternate infinite;
        }
        .loader2 div:nth-child(2){
            animation-delay: 0.2s;
        }
        .loader2 div:nth-child(3){
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            /* from{
                transform: translateY(0);
            } */
            to{
                transform: translateY(-15px);
            }
        }
        .loader3{
            margin-top: 50px;
            width: 30px;
            height: 40px;
            background: blue;
            border-radius: 50%;
            animation: pulse 1s infinite;            
        }
        @keyframes pulse {
            0%{
                transform: scale(1);
                opacity: 1;
            }
            50%{
                transform: scale(1.5);
                opacity: 0.5;
            }
            100%{
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>

</head>
<body>
    <div class="loader"></div>
    <div class="loader2">
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div class="loader3"></div>
</body>
</html>
