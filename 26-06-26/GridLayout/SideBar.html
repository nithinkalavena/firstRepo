<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            height: 300px;
        }
        .sideBar{
            background: #4caf50;
        }
        .content{
            background: lightblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sideBar">SideBar</div>
        <div class="content">Content</div>
    </div>
</body>
</html>
