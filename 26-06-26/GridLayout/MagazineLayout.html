<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 200px 200px;
            gap: 10px;
        }
        .item1{
            background: orange;
            grid-row: 1/3;
        }
        .item{
            background: skyblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">Article1</div>
        <div class="item">Article2</div>
        <div class="item">Article3</div>
    </div>
</body>
</html>
