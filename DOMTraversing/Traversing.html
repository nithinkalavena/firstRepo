<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .highlight{
            background-color: yellow;
        }
        .parent-highlight{
            border: 2px solid red;
        }
        li{
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="container">
        <ul id="list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>
    <script>
        let items = document.querySelectorAll('#list li')
        // let a=10
        // let b='10'
        // console.log(a==b)
        items.forEach(item=>{
            item.addEventListener('click',function(){
                document.querySelectorAll('li').forEach(li => li.classList.remove('highlight'))
                document.getElementById('container').classList.remove('parent-highlight')
                //Highlighting clicked item (self)
                this.classList.add('highlight')
                //Traversing Sideways -> next sibling
                let next = this.nextElementSibling
                if(next)
                    next.classList.add('highlight')

                //traversing up -> parent
                let parent = this.parentElement.parentElement
                parent.classList.add('parent-highlight')
            })
        })
    </script>
</body>
</html>
