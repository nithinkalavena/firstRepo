<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position: relative;            
            width: 300px;
            height: 200px;
            background: lightgray;
        }
        .child{
            position: absolute;
            background: orange;
            top: 20px;
            right: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="parent">
        Parent
        <div class="child">Absolute Box</div>
    </div>
</body>
</html>
