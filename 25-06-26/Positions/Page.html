<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .header{
            position: sticky;
            top: 0;
            background: steelblue;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .card{
            position: relative;
            width: 300px;
            height: 200px;
            margin: 50px auto;
            background: lightgray;
            border: 2px solid black;
        }
        .badge{
            position: absolute;
            top: 10px;
            right: 20px;
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
        }
        .content{
            height: 1200px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        Sticky Navigation Bar
    </div>
    <div class="content">
        <div class="badge">New</div>
        <div class="card">
            <h2 style="padding: 20px;">Product Card</h2>
            <p>The card is <b>relative</b>, so the badge is positioned <b>absolutely </b>inside it.</p>        
        </div>
    <p>scroll down to see that the header remains at the top</p>
    </div>
</body>
</html>
