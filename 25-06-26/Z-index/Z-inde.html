<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            position: absolute;
            width: 150px;
            height: 150px;
            background: red;
            z-index: 1;
        }
        .box2{
            position: absolute;
            left: 50px;
            top: 50px;
            width: 150px;
            height: 150px;
            background: blue;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- Controls which element appears on top -->
    <div class="box1"></div>
    <div class="box2"></div>
</body>
</html>
