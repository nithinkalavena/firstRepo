<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- async and await are built on top of promises and make asynchronous code look synchronous -->
    <script>
        //async function
        async function message() {
            return 'Hello'
        }
        message().then(data=>console.log(data))
        //await example
        async function getData() {
            let res = await fetch('https://jsonplaceholder.typicode.com/users')
            let data = await res.json()
            console.log(data)   
        }
        getData()
        //Error handling
        async function getDatat2(){
            try{
                let res = await fetch('https://jsonplaceholder.typicode.com/users')
                let data = await res.json()
                console.log(data)  
            }
            catch(err){
                console.log(err)
            }
        }
        getDatat2()
    </script>
</body>
</html>
